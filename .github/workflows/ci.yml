name: Smart Inventory CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-verification:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'inventory-management/backend/package.json'

      - name: Install Backend Dependencies
        working-directory: ./inventory-management/backend
        run: npm ci

      - name: Verify Backend JavaScript Syntax
        working-directory: ./inventory-management/backend
        run: node -c index.js

      - name: Run Backend Automated Tests
        working-directory: ./inventory-management/backend
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/inventory_test_db
          JWT_SECRET: ci_test_jwt_secret_key_12345
          NODE_ENV: test
        run: npm test -- --coverage=false

  frontend-verification:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'inventory-management/frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: ./inventory-management/frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: ./inventory-management/frontend
        run: npm run build

  docker-verification:
    name: Docker Container Config Validation
    runs-on: ubuntu-latest
    needs: [ backend-verification, frontend-verification ]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        working-directory: ./inventory-management
        run: docker compose config
