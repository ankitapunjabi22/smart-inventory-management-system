services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: inventory_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: inventory_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory_network

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/inventory_db
      JWT_SECRET: super_secure_dev_jwt_secret_smart_inventory_2026_key
      JWT_EXPIRE: 7d
      NODE_ENV: production
      CLIENT_URL: http://localhost:80
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - inventory_network

  # Frontend Web UI (Nginx + React SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - inventory_network

volumes:
  mongo_data:
    driver: local

networks:
  inventory_network:
    driver: bridge
